services:
  db:
    image: postgres:16
    container_name: mrp-postgres
    environment:
      POSTGRES_USER: mrp
      POSTGRES_PASSWORD: mrp_pw
      POSTGRES_DB: mrp
    ports:
      - "5432:5432"
    volumes:
      - mrp_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mrp_pgdata: